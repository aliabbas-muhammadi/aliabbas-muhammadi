name: Update contributions table

on:
  schedule:
    - cron: '17 6 * * *' # daily, ~06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-contributions
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate contributions table
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-contributions.mjs

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain README.md)" ]]; then
            git config user.name "aliabbas-muhammadi"
            git config user.email "143003167+aliabbas-muhammadi@users.noreply.github.com"
            git add README.md
            git commit -m "chore: refresh open-source contributions table"
            git push
          else
            echo "No changes."
          fi
